# Local review only; merge after docker-compose.yml. No operational bindings.
services:
  database:
    ports: !override []
  osrm-prepare:
    volumes: !override
      - ./.ci-work/osrm:/data
  osrm:
    ports: !override []
    volumes: !override
      - ./.ci-work/osrm:/data:ro
  vroom:
    ports: !override []
  backend:
    ports: !override ["127.0.0.1:${REVIEW_API_PORT:-18000}:8000"]
    environment:
      ROUTEOPS_VROOM_URL: http://vroom:3000
      ROUTEOPS_OSRM_URL: http://osrm:5000
      ROUTEOPS_CORS_ORIGINS: http://127.0.0.1:${REVIEW_UI_PORT:-15173}
  planning-worker:
    environment:
      ROUTEOPS_VROOM_URL: http://vroom:3000
      ROUTEOPS_OSRM_URL: http://osrm:5000
  comparison-worker:
    environment:
      ROUTEOPS_VROOM_URL: http://vroom:3000
      ROUTEOPS_OSRM_URL: http://osrm:5000
  frontend:
    ports: !override ["127.0.0.1:${REVIEW_UI_PORT:-15173}:5173"]
