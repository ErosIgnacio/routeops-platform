[project]
name = "routeops-backend"
version = "0.1.0"
description = "RouteOps planning API"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires the Docker Compose dependency stack",
]

[tool.coverage.run]
branch = true
source = ["routeops"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["routeops"]
