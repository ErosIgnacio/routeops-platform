name: routeops

x-local-app-hardening: &local_app_hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  database:
    image: postgis/postgis:18-3.6@sha256:7e00e8c3539fdd43f513b98806c8204714dcd09dea683c259e333d7690317119
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routeops}
      POSTGRES_USER: ${POSTGRES_USER:-routeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:26.9.0-debian@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    profiles: ["tools"]
    volumes:
      - ./data/osrm:/data
    entrypoint: ["/bin/sh", "/scripts/prepare-osrm.sh"]
    command: ["/data/santiago-demo.osm"]
    configs:
      - source: prepare_osrm
        target: /scripts/prepare-osrm.sh

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:26.9.0-debian@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "1000"
      - --max-viaroute-size
      - "1000"
      - /data/santiago-demo.osrm
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0@sha256:247d5683d6745c755d718a156d16b16aac80baccc276a003a68b986c13883b08
    environment:
      VROOM_ROUTER: osrm
      VROOM_LOG: /tmp
    volumes:
      - ./infrastructure/vroom/config.yml:/conf/config.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - osrm
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  backend:
    <<: *local_app_hardening
    build:
      context: ./backend
    environment:
      ROUTEOPS_ENV: ${ROUTEOPS_ENV:-development}
      ROUTEOPS_LOG_LEVEL: ${ROUTEOPS_LOG_LEVEL:-INFO}
      ROUTEOPS_DATABASE_URL: ${ROUTEOPS_DATABASE_URL:?Set ROUTEOPS_DATABASE_URL in .env}
      ROUTEOPS_VROOM_URL: ${ROUTEOPS_VROOM_URL:-http://vroom:3000}
      ROUTEOPS_OSRM_URL: ${ROUTEOPS_OSRM_URL:-http://osrm:5000}
      ROUTEOPS_SOLVER_TIMEOUT_SECONDS: ${ROUTEOPS_SOLVER_TIMEOUT_SECONDS:-15}
      ROUTEOPS_HTTP_CONNECT_TIMEOUT_SECONDS: ${ROUTEOPS_HTTP_CONNECT_TIMEOUT_SECONDS:-2}
      ROUTEOPS_HTTP_READ_TIMEOUT_SECONDS: ${ROUTEOPS_HTTP_READ_TIMEOUT_SECONDS:-20}
      ROUTEOPS_CORS_ORIGINS: ${ROUTEOPS_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ROUTEOPS_ALLOWED_HOSTS: ${ROUTEOPS_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],backend}
      ROUTEOPS_MAP_DATASET_SHA256: ${ROUTEOPS_MAP_DATASET_SHA256:-22230c1c093a0fe50bbb240cce3d2c36aaf34e8bfb2fe136b76405084de213c4}
      ROUTEOPS_IMPORT_STORAGE_ROOT: /app/private-imports
      ROUTEOPS_IMPORT_MAX_FILE_BYTES: ${ROUTEOPS_IMPORT_MAX_FILE_BYTES:-20971520}
      ROUTEOPS_IMPORT_MAX_PACKAGE_BYTES: ${ROUTEOPS_IMPORT_MAX_PACKAGE_BYTES:-104857600}
      ROUTEOPS_IMPORT_RETENTION_DAYS: ${ROUTEOPS_IMPORT_RETENTION_DAYS:-30}
      ROUTEOPS_IMPORT_ORPHAN_GRACE_SECONDS: ${ROUTEOPS_IMPORT_ORPHAN_GRACE_SECONDS:-3600}
      ROUTEOPS_IMPORT_VALIDATION_LEASE_SECONDS: ${ROUTEOPS_IMPORT_VALIDATION_LEASE_SECONDS:-120}
      ROUTEOPS_IMPORT_VALIDATION_MAX_ATTEMPTS: ${ROUTEOPS_IMPORT_VALIDATION_MAX_ATTEMPTS:-3}
      ROUTEOPS_PLANNING_LEASE_SECONDS: ${ROUTEOPS_PLANNING_LEASE_SECONDS:-120}
      ROUTEOPS_PLANNING_MAX_ATTEMPTS: ${ROUTEOPS_PLANNING_MAX_ATTEMPTS:-3}
      ROUTEOPS_PLANNING_MAX_SNAP_DISTANCE_M: ${ROUTEOPS_PLANNING_MAX_SNAP_DISTANCE_M:-250}
      ROUTEOPS_PLANNING_MAX_ORDERS: ${ROUTEOPS_PLANNING_MAX_ORDERS:-20}
      ROUTEOPS_PLANNING_MAX_LINES: ${ROUTEOPS_PLANNING_MAX_LINES:-60}
      ROUTEOPS_PLANNING_MAX_VEHICLES: ${ROUTEOPS_PLANNING_MAX_VEHICLES:-6}
      ROUTEOPS_PLANNING_MAX_MATRIX_CELLS: ${ROUTEOPS_PLANNING_MAX_MATRIX_CELLS:-80}
      ROUTEOPS_PLANNING_MAX_SOLVER_MATRIX_CELLS: ${ROUTEOPS_PLANNING_MAX_SOLVER_MATRIX_CELLS:-1024}
      ROUTEOPS_PLANNING_MAX_INVENTORY_POSITIONS: ${ROUTEOPS_PLANNING_MAX_INVENTORY_POSITIONS:-10000}
    volumes:
      - import-originals:/app/private-imports
    command:
      - /bin/sh
      - -ec
      - alembic upgrade head && uvicorn routeops.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
      vroom:
        condition: service_healthy
    restart: unless-stopped

  import-maintenance:
    <<: *local_app_hardening
    build:
      context: ./backend
    environment:
      ROUTEOPS_DATABASE_URL: ${ROUTEOPS_DATABASE_URL:?Set ROUTEOPS_DATABASE_URL in .env}
      ROUTEOPS_IMPORT_STORAGE_ROOT: /app/private-imports
      ROUTEOPS_IMPORT_RETENTION_DAYS: ${ROUTEOPS_IMPORT_RETENTION_DAYS:-30}
      ROUTEOPS_IMPORT_ORPHAN_GRACE_SECONDS: ${ROUTEOPS_IMPORT_ORPHAN_GRACE_SECONDS:-3600}
      ROUTEOPS_IMPORT_MAINTENANCE_INTERVAL_SECONDS: ${ROUTEOPS_IMPORT_MAINTENANCE_INTERVAL_SECONDS:-3600}
    volumes:
      - import-originals:/app/private-imports
    command: ["python", "-m", "routeops.infrastructure.storage.maintenance", "--loop"]
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  import-validation-worker:
    <<: *local_app_hardening
    build:
      context: ./backend
    environment:
      ROUTEOPS_DATABASE_URL: ${ROUTEOPS_DATABASE_URL:?Set ROUTEOPS_DATABASE_URL in .env}
      ROUTEOPS_IMPORT_STORAGE_ROOT: /app/private-imports
      ROUTEOPS_IMPORT_RETENTION_DAYS: ${ROUTEOPS_IMPORT_RETENTION_DAYS:-30}
      ROUTEOPS_IMPORT_VALIDATION_LEASE_SECONDS: ${ROUTEOPS_IMPORT_VALIDATION_LEASE_SECONDS:-120}
      ROUTEOPS_IMPORT_VALIDATION_MAX_ATTEMPTS: ${ROUTEOPS_IMPORT_VALIDATION_MAX_ATTEMPTS:-3}
      ROUTEOPS_IMPORT_VALIDATION_POLL_SECONDS: ${ROUTEOPS_IMPORT_VALIDATION_POLL_SECONDS:-5}
    volumes:
      - import-originals:/app/private-imports
    command: ["python", "-m", "routeops.infrastructure.persistence.validation_worker", "--loop"]
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  planning-worker:
    <<: *local_app_hardening
    build:
      context: ./backend
    environment:
      ROUTEOPS_DATABASE_URL: ${ROUTEOPS_DATABASE_URL:?Set ROUTEOPS_DATABASE_URL in .env}
      ROUTEOPS_VROOM_URL: ${ROUTEOPS_VROOM_URL:-http://vroom:3000}
      ROUTEOPS_OSRM_URL: ${ROUTEOPS_OSRM_URL:-http://osrm:5000}
      ROUTEOPS_SOLVER_TIMEOUT_SECONDS: ${ROUTEOPS_SOLVER_TIMEOUT_SECONDS:-15}
      ROUTEOPS_PLANNING_LEASE_SECONDS: ${ROUTEOPS_PLANNING_LEASE_SECONDS:-120}
      ROUTEOPS_PLANNING_MAX_ATTEMPTS: ${ROUTEOPS_PLANNING_MAX_ATTEMPTS:-3}
      ROUTEOPS_PLANNING_POLL_SECONDS: ${ROUTEOPS_PLANNING_POLL_SECONDS:-5}
      ROUTEOPS_PLANNING_MAX_SNAP_DISTANCE_M: ${ROUTEOPS_PLANNING_MAX_SNAP_DISTANCE_M:-250}
      ROUTEOPS_PLANNING_MAX_ORDERS: ${ROUTEOPS_PLANNING_MAX_ORDERS:-20}
      ROUTEOPS_PLANNING_MAX_LINES: ${ROUTEOPS_PLANNING_MAX_LINES:-60}
      ROUTEOPS_PLANNING_MAX_VEHICLES: ${ROUTEOPS_PLANNING_MAX_VEHICLES:-6}
      ROUTEOPS_PLANNING_MAX_MATRIX_CELLS: ${ROUTEOPS_PLANNING_MAX_MATRIX_CELLS:-80}
      ROUTEOPS_PLANNING_MAX_SOLVER_MATRIX_CELLS: ${ROUTEOPS_PLANNING_MAX_SOLVER_MATRIX_CELLS:-1024}
      ROUTEOPS_PLANNING_MAX_INVENTORY_POSITIONS: ${ROUTEOPS_PLANNING_MAX_INVENTORY_POSITIONS:-10000}
    command: ["python", "-m", "routeops.infrastructure.persistence.planning_worker", "--loop"]
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_started
      vroom:
        condition: service_healthy
    restart: unless-stopped

  comparison-worker:
    <<: *local_app_hardening
    build:
      context: ./backend
    environment:
      ROUTEOPS_DATABASE_URL: ${ROUTEOPS_DATABASE_URL:?Set ROUTEOPS_DATABASE_URL in .env}
      ROUTEOPS_VROOM_URL: ${ROUTEOPS_VROOM_URL:-http://vroom:3000}
      ROUTEOPS_OSRM_URL: ${ROUTEOPS_OSRM_URL:-http://osrm:5000}
      ROUTEOPS_MAP_DATASET_SHA256: ${ROUTEOPS_MAP_DATASET_SHA256:-22230c1c093a0fe50bbb240cce3d2c36aaf34e8bfb2fe136b76405084de213c4}
      ROUTEOPS_SOLVER_TIMEOUT_SECONDS: ${ROUTEOPS_SOLVER_TIMEOUT_SECONDS:-15}
      ROUTEOPS_PLANNING_LEASE_SECONDS: ${ROUTEOPS_PLANNING_LEASE_SECONDS:-120}
      ROUTEOPS_PLANNING_MAX_ATTEMPTS: ${ROUTEOPS_PLANNING_MAX_ATTEMPTS:-3}
      ROUTEOPS_PLANNING_POLL_SECONDS: ${ROUTEOPS_PLANNING_POLL_SECONDS:-5}
      ROUTEOPS_PLANNING_MAX_SNAP_DISTANCE_M: ${ROUTEOPS_PLANNING_MAX_SNAP_DISTANCE_M:-250}
      ROUTEOPS_PLANNING_MAX_ORDERS: ${ROUTEOPS_PLANNING_MAX_ORDERS:-20}
      ROUTEOPS_PLANNING_MAX_LINES: ${ROUTEOPS_PLANNING_MAX_LINES:-60}
      ROUTEOPS_PLANNING_MAX_VEHICLES: ${ROUTEOPS_PLANNING_MAX_VEHICLES:-6}
      ROUTEOPS_PLANNING_MAX_MATRIX_CELLS: ${ROUTEOPS_PLANNING_MAX_MATRIX_CELLS:-80}
      ROUTEOPS_PLANNING_MAX_SOLVER_MATRIX_CELLS: ${ROUTEOPS_PLANNING_MAX_SOLVER_MATRIX_CELLS:-1024}
      ROUTEOPS_PLANNING_MAX_INVENTORY_POSITIONS: ${ROUTEOPS_PLANNING_MAX_INVENTORY_POSITIONS:-10000}
    command: ["python", "-m", "routeops.infrastructure.persistence.comparison_worker", "--loop"]
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_started
      vroom:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    <<: *local_app_hardening
    build:
      context: ./frontend
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

configs:
  prepare_osrm:
    file: ./infrastructure/osrm/prepare-osrm.sh

volumes:
  postgres-data:
  import-originals:
